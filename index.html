<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardioGuard</title>
<meta name="description" content="CardioGuard: early warning and home follow-up for heart-failure patients">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-basic-dist-min@2.35.2/plotly-basic.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#0F1E33; --ink2:#4A5A70; --ink3:#8593A6; --line:#E3E8F0;
  --brand:#0B3C5D; --brand2:#1F5F8B; --heart:#E5484D;
  --ok:#22A06B; --med:#E9A800; --measure:#2F80ED; --warn:#F07F23; --crit:#E5484D; --emerg:#B4232A;
  --okbg:#E6F6EE; --medbg:#FFF6D6; --measurebg:#E7F0FD; --warnbg:#FFEFE1; --critbg:#FDE8E9;
  --r:18px; --shadow:0 1px 2px rgba(15,30,51,.06),0 4px 16px rgba(15,30,51,.06);
  --font:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

/* header */
header{background:var(--brand);color:#fff}
.hd{display:flex;align-items:center;gap:14px;padding:14px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:.2px}
.logo svg{width:34px;height:34px}
.tag{color:#B9CFE2;font-size:13px;font-weight:500}
.spacer{flex:1}
.lang{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:#B9CFE2;padding:12px 16px;font-size:15px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:#fff;border-bottom-color:#fff}

/* demo bar */
.demo{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(15,30,51,.05)}
.db{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.dayinfo{min-width:170px}
.dayinfo b{font-size:15px}
.dayinfo small{display:block;color:var(--ink3);font-size:12px}
.ctrl{display:flex;align-items:center;gap:6px;flex:1;min-width:240px}
.ctrl input[type=range]{flex:1;accent-color:var(--brand)}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;display:grid;place-items:center}
.ib.play{background:var(--brand);color:#fff;border-color:var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.chip:hover{border-color:var(--brand2);color:var(--brand)}
.chip i{font-style:normal;margin-inline-end:4px}
.sim{font-size:11.5px;color:var(--ink3);padding:0 0 8px}

main{padding:20px 0 48px}
.view{display:none}
.view.on{display:block}

/* patient + watch layout */
.pw{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start}
.side{display:grid;gap:20px}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.panel h3{margin:0 0 12px;font-size:16px}
.muted{color:var(--ink3)}

/* phone frame */
.phone{width:100%;max-width:400px;margin:0 auto;background:#0F1E33;border-radius:44px;padding:12px;box-shadow:0 20px 50px rgba(15,30,51,.25)}
.screen{background:var(--bg);border-radius:34px;overflow:hidden;height:780px;overflow-y:auto;scrollbar-width:thin}
.sbar{display:flex;justify-content:space-between;padding:12px 24px 4px;font-size:13px;font-weight:600;color:var(--ink)}
.app{padding:8px 16px 24px;display:grid;gap:14px}
.hello{font-size:22px;font-weight:700;margin:6px 0 0}
.hello small{display:block;font-size:14px;color:var(--ink3);font-weight:500}

.status{border-radius:22px;padding:18px;color:#fff;display:grid;gap:10px}
.status .t{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.status .m{font-size:16px;line-height:1.6}
.status .row{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:14px;padding:10px 14px;font-size:15px;font-weight:600}
.lv0{background:var(--ok)} .lv1{background:var(--warn)} .lv2{background:var(--warn)} .lv3{background:var(--crit)} .lv4{background:var(--emerg)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:16px;padding:12px 14px;border:1px solid var(--line)}
.tile .k{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tile .v{font-size:24px;font-weight:700;margin-top:2px}
.tile .v small{font-size:13px;font-weight:500;color:var(--ink3)}
.tile .d{font-size:12px;color:var(--ink3)}
.tile.bad{border-color:var(--warn);background:var(--warnbg)}
.tile.bad .d{color:#A04A00;font-weight:600}

.sect{background:#fff;border-radius:18px;padding:14px;border:1px solid var(--line)}
.sect h4{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.med{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.med:first-of-type{border-top:0}
.med .n{flex:1;font-size:15px;font-weight:600}
.med .n small{display:block;font-weight:500;color:var(--ink3);font-size:12.5px}
.take{border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--med);color:#3A2A00}
.taken{border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;background:var(--okbg);color:var(--ok)}
.meal{display:grid;grid-template-columns:72px 1fr;gap:8px;padding:6px 0;font-size:14.5px}
.meal b{color:var(--ink2);font-weight:600}
.limits{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.limits span{background:var(--measurebg);color:var(--brand);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.linkbtn{background:none;border:0;color:var(--brand2);font-weight:600;font-size:14px;padding:6px 0}
.no{display:grid;gap:6px;margin-top:8px}
.no div{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 10px;background:var(--critbg);border-radius:10px}
.no div span:last-child{color:var(--ok);font-weight:600}
.ask{background:var(--warnbg);border:1px solid #F9C79A;border-radius:18px;padding:14px}
.ask p{margin:0 0 10px;font-weight:600;font-size:15.5px}
.ask .row{display:flex;gap:8px}
.ask button{flex:1;border-radius:12px;padding:12px;font-size:15px;font-weight:700;border:1px solid var(--line);background:#fff}

/* watch */
.watchwrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.watch{position:relative;width:300px;height:360px;display:grid;place-items:center}
.strap{position:absolute;width:150px;height:360px;background:linear-gradient(#26364D,#1A2638);border-radius:40px;z-index:0}
.case{position:relative;z-index:1;width:290px;height:290px;border-radius:50%;background:#1A2638;display:grid;place-items:center;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.ring{position:absolute;inset:8px;border-radius:50%;border:12px solid var(--ok);transition:border-color .3s}
.ring.flash{animation:flash .6s ease-in-out infinite alternate}
@keyframes flash{from{opacity:1}to{opacity:.25}}
.face{position:relative;width:226px;height:226px;border-radius:50%;background:#05080D;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:6px}
.face .clock{font-size:15px;color:#9FB0C6;font-weight:600}
.face .ic{font-size:40px;line-height:1}
.face .msg{font-size:17px;font-weight:700;line-height:1.35}
.face .sub{font-size:12.5px;color:#9FB0C6}
.face button{margin-top:4px;border:0;border-radius:999px;padding:8px 18px;font-size:15px;font-weight:700}
.wbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wb{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.wb .dot{width:12px;height:12px;border-radius:50%}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--brand)}
.legend{display:grid;gap:8px}
.legend div{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;font-size:14px}
.legend .dot{width:16px;height:16px;border-radius:50%}
.legend em{font-style:normal;color:var(--ink3);font-size:12.5px;font-family:monospace;direction:ltr}

/* engine panel */
.eng{display:grid;gap:10px}
.sig{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sig div{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:12.5px;color:var(--ink2)}
.sig div b{display:block;font-size:18px;margin-bottom:2px}
.sig div.on{background:var(--warnbg);border-color:#F9C79A;color:#A04A00}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ladder div{border-radius:12px;padding:10px 8px;font-size:12.5px;font-weight:600;background:#F0F3F8;color:var(--ink3);text-align:center;line-height:1.4}
.ladder div.on{color:#fff}
.reasons{margin:0;padding-inline-start:18px;display:grid;gap:4px;font-size:14px}
.note{font-size:13.5px;background:#F0F3F8;border-radius:10px;padding:8px 10px}
.note.good{background:var(--okbg);color:#0E6B45;font-weight:600}
.meter{height:10px;border-radius:99px;background:#EEF1F6;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;transition:width .3s}

/* family */
.fam{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{text-align:center;font-size:11.5px;color:var(--ink3)}
.week div i{display:block;height:28px;border-radius:8px;margin-bottom:4px}
.feed{display:grid;gap:10px}
.fi{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;font-size:14px}
.fi .bar{border-radius:99px}
.fi small{color:var(--ink3);display:block;margin-bottom:2px}
.callrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.call{border:0;border-radius:14px;padding:13px;font-weight:700;font-size:15px;color:#fff;background:var(--brand)}
.call.alt{background:#fff;color:var(--brand);border:1px solid var(--line)}

/* doctor */
.rep{display:grid;gap:18px}
.rhead{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.pinfo{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;font-size:14px}
.pinfo div small{display:block;color:var(--ink3);font-size:12px}
.pinfo div b{font-weight:600}
.ai{border-radius:var(--r);padding:18px;background:linear-gradient(135deg,#0B3C5D,#1F5F8B);color:#fff;display:grid;gap:10px}
.ai .lbl{font-size:12px;letter-spacing:.5px;color:#B9CFE2;font-weight:600;display:flex;gap:6px;align-items:center}
.ai p{margin:0;font-size:16px;line-height:1.7}
.ai .disc{font-size:12px;color:#B9CFE2}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.kpi small{color:var(--ink3);font-size:12.5px;display:block;min-height:32px}
.kpi b{font-size:26px;font-weight:700}
.kpi b small{display:inline;font-size:13px;min-height:0}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chart{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 4px}
.chart h4{margin:0 0 2px;font-size:15px}
.chart p{margin:0;font-size:12.5px;color:var(--ink3)}
.chart .plot{height:250px}
.chart.wide{grid-column:1/-1}
.gap{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gap div{background:#F7F9FC;border-radius:14px;padding:12px}
.gap small{color:var(--ink3);font-size:12.5px;display:block}
.gap b{font-size:20px}
table.log{width:100%;border-collapse:collapse;font-size:13.5px}
table.log th{text-align:start;color:var(--ink3);font-weight:600;padding:8px;border-bottom:1px solid var(--line);font-size:12.5px}
table.log td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.lvtag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.rtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--brand);color:#fff}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--brand);color:#fff}

/* how it works */
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.step b{display:block;font-size:30px;color:var(--brand2)}
.step h4{margin:6px 0;font-size:16px}
.step p{margin:0;color:var(--ink2);font-size:14px;line-height:1.65}

.modal{position:fixed;inset:0;background:rgba(15,30,51,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:22px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:20px}
.mbox table{width:100%;border-collapse:collapse;font-size:14px}
.mbox td,.mbox th{padding:8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.mbox th{color:var(--ink3);font-size:12.5px}
.voice{width:100%;max-width:420px;background:#F7F9FC;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px}
.voice .vh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.bub{padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.55;max-width:88%}
.bub.sys{background:#E7F0FD;color:#0B3C5D;justify-self:start}
.bub.me{background:#0B3C5D;color:#fff;justify-self:end}
.vrow{display:flex;gap:6px;flex-wrap:wrap}
.vrow button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600}
.vrow .mic{background:var(--heart);color:#fff;border-color:var(--heart)}
.vrow .mic.on{animation:flash .7s infinite alternate}
.sbarg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sbarg div{background:#F7F9FC;border-radius:14px;padding:12px;font-size:14px;line-height:1.65}
.sbarg b{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--brand2);margin-bottom:4px}
.sbarg b i{font-style:normal;width:24px;height:24px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.qr{display:grid;place-items:center;margin:12px 0}
.qr svg{width:220px;height:220px}
.stag{display:inline-block;border-radius:8px;padding:1px 7px;font-size:11.5px;font-weight:700;margin-inline-end:4px;background:#EEF1F6;color:var(--ink2)}
.stag.clinical{background:var(--warnbg);color:#A04A00}.stag.glucose{background:#F1E9FB;color:#6B3FB8}.stag.adherence{background:var(--measurebg);color:var(--brand)}
@media (max-width:900px){.sbarg{grid-template-columns:1fr 1fr}}
footer{color:var(--ink3);font-size:12.5px;text-align:center;padding:24px 16px}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.how{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .pw,.fam,.rhead,.charts{grid-template-columns:1fr}
  .gap{grid-template-columns:1fr 1fr}
  .pinfo{grid-template-columns:1fr 1fr}
  .phone{border-radius:0;padding:0;box-shadow:none;background:none;max-width:none}
  .screen{border-radius:0;height:auto;overflow:visible;background:none}
  .sbar{display:none}
  .app{padding:0}
}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}.how{grid-template-columns:1fr}.sig{grid-template-columns:repeat(3,1fr)}.ladder{grid-template-columns:1fr 1fr}.watch{transform:scale(.9)}}
@media print{
  header,.demo,nav,footer,.rtools,.noprint{display:none!important}
  body{background:#fff}
  .view{display:none!important} #v-doctor{display:block!important}
  .chart,.kpi,.panel{box-shadow:none;border:1px solid var(--line);break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <div class="logo">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 34s-13-8.2-13-17.2C7 11.6 10.8 8 15.2 8c2.4 0 3.9 1.2 4.8 2.5C20.9 9.2 22.4 8 24.8 8 29.2 8 33 11.6 33 16.8 33 25.8 20 34 20 34z" fill="#E5484D"/><path d="M8.5 20h7l2.2-4.6 3.6 9 2.4-4.4h7.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>CardioGuard</span>
      </div>
      <span class="tag" data-t="tagline"></span>
      <span class="spacer"></span>
      <button class="lang" id="langBtn">English</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-v="patient" class="on" data-t="tab_patient"></button>
      <button data-v="family" data-t="tab_family"></button>
      <button data-v="doctor" data-t="tab_doctor"></button>
      <button data-v="how" data-t="tab_how"></button>
    </nav>
  </div>
</header>

<div class="demo">
  <div class="wrap">
    <div class="db">
      <div class="dayinfo"><b id="dayLbl"></b><small id="dateLbl"></small></div>
      <div class="ctrl">
        <button class="ib" id="prev" aria-label="previous day">‹</button>
        <input type="range" id="slider" min="0" max="89" value="20" aria-label="day">
        <button class="ib" id="next" aria-label="next day">›</button>
        <button class="ib play" id="play" aria-label="play">▶</button>
      </div>
      <div class="chips">
        <button class="chip" data-sc="normal"><i>🟢</i><span data-t="sc_normal"></span></button>
        <button class="chip" data-sc="false"><i>⚖️</i><span data-t="sc_false"></span></button>
        <button class="chip" data-sc="sugar"><i>🩸</i><span data-t="sc_sugar"></span></button>
        <button class="chip" data-sc="episode"><i>🫀</i><span data-t="sc_episode"></span></button>
        <button class="chip" data-sc="after"><i>✅</i><span data-t="sc_after"></span></button>
      </div>
    </div>
    <div class="sim" data-t="sim_note"></div>
  </div>
</div>

<main class="wrap">
  <!-- PATIENT + WATCH -->
  <section class="view on" id="v-patient">
    <div class="pw">
      <div class="phone"><div class="screen">
        <div class="sbar"><span id="pTime">08:30</span><span>●●● 5G</span></div>
        <div class="app" id="patientApp"></div>
      </div></div>
      <div class="side">
        <div class="panel">
          <h3 data-t="watch_title"></h3>
          <div class="watchwrap">
            <div class="watch"><div class="strap"></div>
              <div class="case"><div class="ring" id="ring"></div>
                <div class="face" id="face"></div>
              </div>
            </div>
            <div class="wbtns" id="wbtns"></div>
            <div class="voice" id="voice"></div>
            <label class="toggle"><input type="checkbox" id="hearing"><span data-t="hearing_mode"></span></label>
          </div>
        </div>
        <div class="panel">
          <h3 data-t="legend_title"></h3>
          <div class="legend" id="legend"></div>
        </div>
        <div class="panel eng" id="engine"></div>
      </div>
    </div>
  </section>

  <!-- FAMILY -->
  <section class="view" id="v-family">
    <div class="fam">
      <div class="phone"><div class="screen">
        <div class="sbar"><span>09:10</span><span>●●● 5G</span></div>
        <div class="app" id="familyApp"></div>

function primaryStream(d) {

  const s = d.streams || [];

  if (s.includes("glucose")) return "glucose";
  if (s.includes("adherence")) return "adherence";
  return "ok";
}
function statusMsg(d) {

  if (p === "glucose") return t("sm_glu");
  if (p === "adherence") {
    if (d.reasons.some(r => r[0] === "noweigh")) return t("sm_noweigh");
    return d.level >= 2 ? t("sm_dose2") : (pendingMeds(cur).length ? t("sm_dose") : t("sm0"));
  }
  if (p === "clinical") {
    if (d.level === 3) return t("sm3");
    if (d.level === 2) return t("sm2");

}

const YES = /(أخذت|اخذت|خذيت|إيه|ايه|ايوه|أيوه|نعم|تم|نعم|نعمم|أحس|احس|ضيق|yes|took|yeah|done)/i;
const NO = /(لا|ما أخذت|بعدين|الحمد لله|الحمدلله|no|later|fine)/i;
function reply(mode, yes, heard) {
  const v = VOICE[mode];

  document.getElementById("pinfo").innerHTML = [
    [t("name"), `${t("patient_name")} · ${DATA.patient.id}`], [t("age"), `${DATA.patient.age} ${t("years")}`], [t("diagnosis"), t("dx")],
    [t("meds_l"), MEDS.filter((m, i, a) => a.findIndex(x => x.id === m.id) === i).map(m => m[lang]).join(" · ")], [t("dr"), t("physician")],
    [t("base_l"), `${num(B.weight.median, 1)} ${t("kg")} · SpO₂ ${num(B.spo2.median)}% · ${num(B.resp.median)}${t("per_min")}`],
  ].map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join("");
  document.getElementById("aiText").textContent = aiSummary(win);
  renderSBAR(win);

  const diet = Math.round(win.filter(x => x.diet_ok).length / win.length * 100);
  const meas = Math.round(win.filter(x => x.weight != null && x.spo2 != null && !x.suspect).length / win.length * 100);
  const cnt = s => win.filter(x => (x.streams || []).includes(s)).length;
  const fa = win.filter(x => x.false_alarm_blocked).length;
  const e = episodeIn(win);
  document.getElementById("kpis").innerHTML = [
    [t("k_med"), `${medAdh(win)}<small>%</small>`], [t("k_diet"), `${diet}<small>%</small>`], [t("k_meas"), `${meas}<small>%</small>`],
    [t("k_streams"), `<span style="font-size:15px;line-height:1.9;display:block">${["clinical", "glucose", "adherence"].map(s => `<span class="stag ${s}">${t("stream_" + s)} ${cnt(s)}</span>`).join(" ")}</span>`],
    [t("k_fa"), fa], [t("k_early"), e && cur >= e.symptoms_day ? `${e.symptoms_day - e.first_alert} <small>${t("days")}</small>` : "—"],
  ].map(([k, v]) => `<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join("");

  drawCharts(win);

  const g = document.getElementById("gapBox");
  if (e && cur >= e.first_alert) {
    g.innerHTML = `<p style="margin:0 0 12px;line-height:1.7">${fmt(t("gap_text"), {s: shortDate(DAYS[e.start].date), e: shortDate(DAYS[Math.min(e.end, cur)].date), m: e.missed_diuretic, salty: e.salty_days, early: e.symptoms_day - e.first_alert})}</p>
      <div class="gap"><div><small>${t("g_missed")}</small><b>${e.missed_diuretic}</b></div><div><small>${t("g_salty")}</small><b>${e.salty_days}</b></div><div><small>${t("g_peak")}</small><b>+${e.peak_weight_gain} ${t("kg")}</b></div><div><small>${t("g_early")}</small><b>${e.symptoms_day - e.first_alert} ${t("days")}</b></div></div>`;
  } else g.innerHTML = `<p class="muted" style="margin:0">${t("gap_none")}</p>`;

  const rows = win.filter(x => x.level || x.false_alarm_blocked || x.suspect || x.reviewed).reverse();
  const act = x => x.reviewed ? t("a_rev") : x.suspect || x.false_alarm_blocked ? t("a_fa") : t("a" + x.level);
  document.getElementById("logTbl").innerHTML = `<tr><th>${t("l_date")}</th><th>${t("l_level")}</th><th>${t("l_what")}</th><th>${t("l_action")}</th></tr>` +
    (rows.length ? rows.map(x => `<tr><td style="white-space:nowrap">${shortDate(x.date)}</td><td><span class="lvtag" style="background:${LV_COLOR[x.level]}">${x.level ? t("L" + x.level) : "—"}</span><div style="margin-top:4px">${streamTags(x)}</div></td><td>${[...visibleReasons(x).map(reasonText), ...x.notes.map(noteText)].join("<br>")}</td><td>${act(x)}</td></tr>`).join("")
      : `<tr><td colspan="4" class="muted">${t("feed_none")}</td></tr>`);
}

const PL = {displayModeBar: false, responsive: true};
function layout(extra) {
  return Object.assign({
    margin: {l: 44, r: 44, t: 10, b: 34}, paper_bgcolor: "#fff", plot_bgcolor: "#fff",
    font: {family: "IBM Plex Sans Arabic, IBM Plex Sans, sans-serif", size: 12, color: "#4A5A70"},
    xaxis: {gridcolor: "#EEF1F6", type: "date", tickformat: "%d/%m"}, yaxis: {gridcolor: "#EEF1F6", zeroline: false},
    showlegend: true, legend: {orientation: "h", y: 1.12, x: 0, font: {size: 11}}, hovermode: "x unified",
  }, extra);
}
function episodeShapes() {
  const shapes = [];
  EP.forEach(e => { if (e.first_alert <= cur) shapes.push({type: "rect", xref: "x", yref: "paper", x0: DAYS[e.start].date, x1: DAYS[Math.min(e.end, cur)].date, y0: 0, y1: 1, fillcolor: "rgba(240,127,35,.10)", line: {width: 0}, layer: "below"}); });
  shapes.push({type: "line", xref: "x", yref: "paper", x0: DAYS[cur].date, x1: DAYS[cur].date, y0: 0, y1: 1, line: {color: "#0B3C5D", width: 1, dash: "dot"}});
  return shapes;
}
function drawCharts(win) {
  if (!window.Plotly) return;
  const x = win.map(d => d.date), sh = episodeShapes();
  const bw = B.weight.median, tw = DATA.thresholds.weight_gain;
  const valid = win.filter(d => !d.suspect && d.weight != null), sus = win.filter(d => d.suspect);
  Plotly.react("chW", [
    {x: [x[0], x[x.length - 1], x[x.length - 1], x[0]], y: [bw - tw, bw - tw, bw + tw, bw + tw], fill: "toself", mode: "lines", fillcolor: "rgba(34,160,107,.10)", line: {width: 0}, hoverinfo: "skip", name: lang === "ar" ? "الحد الآمن" : "Safe range"},
    {x: valid.map(d => d.date), y: valid.map(d => d.weight), mode: "lines+markers", name: t("r_weight"), line: {color: "#0B3C5D", width: 2}, marker: {size: valid.map(d => d.streams.includes("clinical") ? 9 : 5), color: valid.map(d => d.streams.includes("clinical") ? LV_COLOR[d.level] : "#0B3C5D")}},
    {x: sus.map(d => d.date), y: sus.map(d => d.weight), mode: "markers", name: lang === "ar" ? "قراءة خاطئة (تم تجاهلها)" : "Wrong reading (ignored)", marker: {symbol: "x", size: 11, color: "#8593A6"}},
  ], layout({shapes: sh, yaxis: {gridcolor: "#EEF1F6", title: {text: t("kg"), font: {size: 11}}}}), PL);
  Plotly.react("chB", [
    {x, y: win.map(d => d.spo2), name: "SpO₂ %", mode: "lines", line: {color: "#2F80ED", width: 2}},
    {x, y: win.map(d => d.resp_night), name: t("r_resp"), mode: "lines", yaxis: "y2", line: {color: "#F07F23", width: 2}},
  ], layout({shapes: sh, yaxis: {gridcolor: "#EEF1F6", range: [88, 99]}, yaxis2: {overlaying: "y", side: "right", range: [10, 24], showgrid: false}}), PL);
  Plotly.react("chA", [
    {x, y: win.map(d => d.steps), type: "bar", name: t("r_steps"), marker: {color: win.map(d => d.signals.activity ? "#F07F23" : "#9DB7D3")}},
  ], layout({shapes: sh, showlegend: false}), PL);
  Plotly.react("chP", [
    {x, y: win.map(d => d.sbp), name: lang === "ar" ? "الانقباضي" : "Systolic", mode: "lines", line: {color: "#0B3C5D", width: 2}},
    {x, y: win.map(d => d.rest_hr), name: t("r_hr"), mode: "lines", yaxis: "y2", line: {color: "#E5484D", width: 2}},
  ], layout({shapes: sh, yaxis: {gridcolor: "#EEF1F6", range: [85, 150]}, yaxis2: {overlaying: "y", side: "right", range: [55, 95], showgrid: false}}), PL);
  Plotly.react("chG", [
    {x, y: win.map(d => d.glu_mean), name: lang === "ar" ? "المتوسط اليومي" : "Daily mean", mode: "lines", line: {color: "#7B4FD0", width: 2}},
    {x, y: win.map(d => d.glu_night_min), name: t("night_low"), mode: "lines+markers", line: {color: "#B79BE8", width: 1.5}, marker: {size: win.map(d => d.glu_night_min < 70 ? 10 : 4), color: win.map(d => d.glu_night_min < 70 ? "#E5484D" : "#B79BE8")}},
  ], layout({shapes: [...sh, {type: "line", xref: "paper", x0: 0, x1: 1, y0: 70, y1: 70, line: {color: "#E5484D", width: 1, dash: "dash"}}], yaxis: {gridcolor: "#EEF1F6", range: [40, 200]}}), PL);
  Plotly.react("chD", [
    {x, y: win.map(() => lang === "ar" ? "المدر" : "Water pill"), type: "scatter", mode: "markers", marker: {symbol: "square", size: 12, color: win.map(d => d.diuretic_taken ? "#22A06B" : "#E5484D")}, name: "", hoverinfo: "x"},
    {x, y: win.map(() => lang === "ar" ? "الوزن" : "Weigh-in"), type: "scatter", mode: "markers", marker: {symbol: "square", size: 12, color: win.map(d => d.weight != null ? "#22A06B" : "#E5484D")}, name: "", hoverinfo: "x"},
    {x, y: win.map(() => lang === "ar" ? "الغذاء" : "Diet"), type: "scatter", mode: "markers", marker: {symbol: "square", size: 12, color: win.map(d => d.diet_ok ? "#22A06B" : "#E5484D")}, name: "", hoverinfo: "x"},
  ], layout({shapes: sh, showlegend: false, margin: {l: 70, r: 20, t: 10, b: 34}, yaxis: {gridcolor: "#fff", automargin: true}}), PL);
}

/* -------------------------------------------------------- how / diet / share */
function renderHow() {
  document.getElementById("howBox").innerHTML = [1, 2, 3, 4].map(i => `<div class="step"><b>0${i}</b><h4>${t(`how${i}t`)}</h4><p>${t(`how${i}`)}</p></div>`).join("");
  document.getElementById("payBox").innerHTML = [["🔁", 1], ["🏥", 2], ["⌚", 3], ["🔗", 4]].map(([ic, i]) => `<div class="step"><b>${ic}</b><h4>${t(`pay${i}t`)}</h4><p>${t(`pay${i}`)}</p></div>`).join("");
}
function openDiet() {
  const h = [t("breakfast"), t("lunch"), t("dinner")];
  document.getElementById("dietTbl").innerHTML = `<table><tr><th></th>${h.map(x => `<th>${x}</th>`).join("")}</tr>${DIET[lang].map((r, i) => `<tr><th>${t("wd")[i]}</th>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>
    <h4 style="margin:16px 0 8px">🚫 ${t("show_no").replace(" ›", "")}</h4><div class="no">${AVOID[lang].map(([a, b]) => `<div><span>${a}</span><span>${b}</span></div>`).join("")}</div>`;
  document.getElementById("dietModal").classList.add("on");
}
function reportUrl() { return location.href.split(/[?#]/)[0] + `?view=doctor&day=${cur + 1}&lang=${lang}`; }
function openShare() {
  const box = document.getElementById("qr");
  if (window.qrcode) { const q = qrcode(0, "M"); q.addData(reportUrl()); q.make(); box.innerHTML = q.createSvgTag({cellSize: 5, margin: 2, scalable: true}); }
  else box.innerHTML = `<div class="muted" style="font-size:12px;word-break:break-all">${reportUrl()}</div>`;
  document.getElementById("shareModal").classList.add("on");
}

/* -------------------------------------------------------------- shell */
let view = "patient";
function renderStatic() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.getElementById("langBtn").textContent = lang === "ar" ? "English" : "العربية";
  renderWatchButtons(); renderHow();
}
function render() {
  const d = DAYS[cur];
  document.getElementById("slider").value = cur;
  document.getElementById("dayLbl").textContent = `${t("day")} ${cur + 1} ${t("of")} ${DAYS.length}`;
  document.getElementById("dateLbl").textContent = `${t("wd")[weekday(d.date)]} · ${dateStr(d.date)}`;
  if (view === "patient") { renderPatient(); renderWatch(); renderEngine(); }
  if (view === "family") renderFamily();
  if (view === "doctor") renderDoctor();
}
function go(day) { cur = Math.max(0, Math.min(DAYS.length - 1, day)); watchMode = null; convo = []; render(); }
function stop() { clearInterval(playing); playing = null; document.getElementById("play").textContent = "▶"; }
function step() {
  const before = DAYS[cur].level, beforeS = (DAYS[cur].streams || []).join();
  go(cur + 1);
  const d = DAYS[cur];
  if (view === "patient" && (d.level > before || (d.level && d.streams.join() !== beforeS))) renderWatch(true);
}
function play(from, to, ms = 1100) {
  stop(); if (from != null) go(from);
  document.getElementById("play").textContent = "❚❚";
  playing = setInterval(() => { if (cur >= (to ?? DAYS.length - 1)) return stop(); step(); }, ms);
}
document.getElementById("slider").oninput = e => { stop(); go(+e.target.value); };
document.getElementById("prev").onclick = () => { stop(); go(cur - 1); };
document.getElementById("next").onclick = () => { stop(); step(); };
document.getElementById("play").onclick = () => playing ? stop() : play();
document.querySelectorAll("[data-sc]").forEach(b => b.onclick = () => {
  const sc = b.dataset.sc;
  if (sc === "normal") { stop(); go(20); }
  if (sc === "false") play(37, 40, 1400);
  if (sc === "sugar") play(49, 50, 1400);
  if (sc === "episode") play(62, 73, 1400);
  if (sc === "after") { stop(); go(85); }
});
document.getElementById("tabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.v;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + view));
  render();
  if (view === "doctor") setTimeout(() => document.querySelectorAll(".plot").forEach(p => window.Plotly && Plotly.Plots.resize(p)), 50);
};
document.getElementById("period").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  period = +b.dataset.p; document.querySelectorAll("#period button").forEach(x => x.classList.toggle("on", x === b)); renderDoctor();
};
document.getElementById("langBtn").onclick = () => { lang = lang === "ar" ? "en" : "ar"; convo = []; renderStatic(); render(); };
document.getElementById("hearing").onchange = e => { hearing = e.target.checked; renderWatch(true); };
document.getElementById("printBtn").onclick = () => window.print();
document.getElementById("closeDiet").onclick = () => document.getElementById("dietModal").classList.remove("on");
document.getElementById("closeShare").onclick = () => document.getElementById("shareModal").classList.remove("on");
document.getElementById("openReport").onclick = () => { document.getElementById("shareModal").classList.remove("on"); document.querySelector('#tabs [data-v="doctor"]').click(); window.scrollTo(0, 0); };
["dietModal", "shareModal"].forEach(id => document.getElementById(id).onclick = e => { if (e.target.id === id) e.currentTarget.classList.remove("on"); });
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

const params = new URLSearchParams(location.search);
if (params.get("lang") === "en") lang = "en";
if (params.get("day")) cur = Math.max(0, Math.min(DAYS.length - 1, +params.get("day") - 1));
renderStatic();
if (params.get("view")) { const b = document.querySelector(`#tabs [data-v="${params.get("view")}"]`); if (b) b.click(); else render(); } else render();
</script>
</body>
